<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duplicati Fast Restore</title>
<style>
:root{font:15px system-ui,Segoe UI,sans-serif;color:#e8eef9;background:#101823;color-scheme:dark}
*{box-sizing:border-box}body{margin:0}header{padding:16px 24px;background:#172232;border-bottom:1px solid #314154;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
h1{font-size:19px;margin:0}button,input,select{font:inherit}button,select,input{padding:9px 12px;border-radius:7px;border:1px solid #43546b;background:#202f42;color:inherit}
button{cursor:pointer}button:hover{background:#30445e}button:disabled{opacity:.45;cursor:default}
main{max-width:1500px;margin:0 auto;padding:20px 24px} .toolbar,.bottom{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
#version{max-width:480px}#search{flex:1;min-width:200px}#crumbs{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:12px 0}
.crumb{border:0;background:none;color:#8fc9ff;padding:6px}.layout{display:grid;grid-template-columns:minmax(180px,230px) 1fr;gap:16px;min-height:55vh}
aside,.panel{border:1px solid #33475e;border-radius:10px;background:#172232;overflow:hidden}
aside{padding:16px}aside button{width:100%;text-align:left;margin:3px 0;border:0;background:transparent}
table{width:100%;border-collapse:collapse}th,td{padding:13px 14px;text-align:left;border-bottom:1px solid #2b3e53}
th{font-size:12px;color:#99afc8;letter-spacing:.07em;text-transform:uppercase}
tr.item:hover{background:#22364d}tr.item{cursor:pointer}td.name{width:65%}
.fileicon{display:inline-block;width:29px;color:#87bdfa} .muted{color:#9db1c7}
#overlay{display:none;position:absolute;inset:0;background:#111d2ac7;align-items:center;justify-content:center;z-index:2;flex-direction:column;gap:14px}
.panel{position:relative;min-height:370px} .spinner{width:36px;height:36px;border:4px solid #4b6a87;border-top-color:#a2d3ff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}#message{min-height:22px;white-space:pre-wrap}#destination{flex:1;min-width:280px}
@media(max-width:700px){.layout{grid-template-columns:1fr}aside{display:none}main{padding:12px}td{padding:10px 5px}}
</style></head>
<body><header><h1>▣ Duplicati Fast Restore</h1><span class="muted">Backup file browser</span></header>
<main>
<div class="toolbar"><label for="version">Snapshot</label><select id="version"></select><input id="search" type="search" placeholder="Search files in selected snapshot"><button id="searchBtn">Search</button></div>
<nav id="crumbs" aria-label="Folder path"></nav>
<div class="layout"><aside><strong>Locations</strong><button id="rootBtn">⌂ Backup root</button><p class="muted">Open folders to browse a snapshot. Check files and folders to restore them.</p><div id="selectedCount">0 selected</div></aside>
<section class="panel"><div id="overlay" role="status" aria-live="polite"><div class="spinner"></div><span id="loadingText">Loading…</span></div>
<table><thead><tr><th style="width:44px"><input id="selectAll" type="checkbox" aria-label="Select all visible"></th><th>Name</th><th>Size</th><th>Type</th></tr></thead><tbody id="rows"></tbody></table>
<p id="empty" class="muted" style="padding:20px;display:none">No matching files.</p></section></div>
<p id="notice" class="muted"></p>
<div class="bottom"><label for="destination">Restore to</label><input id="destination" placeholder="Full path to restore destination"><button id="restoreBtn" disabled>Restore selected</button><button id="clearBtn">Clear selection</button></div>
<div id="message" role="status" aria-live="polite"></div></main>
<script>
const $=id=>document.getElementById(id), selected=new Map();
let current='', request=0, busy=false, latest=[];
async function api(url,options){let response=await fetch(url,options),data=await response.json();if(!response.ok)throw Error(data.error||response.statusText);return data}
function loading(state,text){busy=state;$('overlay').style.display=state?'flex':'none';$('loadingText').textContent=text||'Loading…';$('restoreBtn').disabled=state||!selected.size;$('searchBtn').disabled=state;$('version').disabled=state}
function updateSelection(){$('selectedCount').textContent=selected.size+' selected';$('restoreBtn').disabled=busy||!selected.size}
function breadcrumbs(){const b=$('crumbs');b.replaceChildren();let components=current.split('/').filter(Boolean),loc='';let home=document.createElement('button');home.className='crumb';home.textContent='⌂ Root';home.onclick=()=>navigate('');b.append(home);
for(let segment of components){loc+=segment+'/';let sep=document.createElement('span');sep.textContent='›';b.append(sep);let part=document.createElement('button');part.className='crumb';part.textContent=segment;let destination=loc;part.onclick=()=>navigate(destination);b.append(part)}}
function render(entries,truncated){latest=entries;const tbody=$('rows');tbody.replaceChildren();$('empty').style.display=entries.length?'none':'block';$('notice').textContent=truncated?'Showing first 500 results. Narrow your search.':'';
for(let item of entries){let folder=['folder','directory'].includes((item.type||'').toLowerCase()),tr=document.createElement('tr');tr.className='item';
let tick=document.createElement('td'),cb=document.createElement('input');cb.type='checkbox';cb.checked=selected.has(item.path);cb.onclick=e=>e.stopPropagation();cb.onchange=()=>{if(cb.checked)selected.set(item.path,item);else selected.delete(item.path);updateSelection()};tick.append(cb);tr.append(tick);
let name=document.createElement('td');name.className='name';let ico=document.createElement('span');ico.className='fileicon';ico.textContent=folder?'📁':'▤';name.append(ico,document.createTextNode(item.name));tr.append(name);
let size=document.createElement('td');size.className='muted';size.textContent=item.size==null?'—':formatSize(item.size);tr.append(size);
let type=document.createElement('td');type.className='muted';type.textContent=folder?'Folder':'File';tr.append(type);
tr.onclick=()=>folder?navigate(item.path):cb.click();tbody.append(tr)}
$('selectAll').checked=false;updateSelection()}
function formatSize(value){if(value<1024)return value+' B';let units=['KB','MB','GB','TB'],i=-1;do{value/=1024;i++}while(value>=1024&&i<3);return value.toFixed(1)+' '+units[i]}
async function navigate(path='',search=''){let seq=++request;current=path;breadcrumbs();loading(true,'Loading snapshot folder…');$('message').textContent='';
try{let data=await api('/browse?version='+encodeURIComponent($('version').value)+'&directory='+encodeURIComponent(path)+'&search='+encodeURIComponent(search));if(seq===request)render(data.entries,data.truncated)}
catch(e){$('message').textContent='Browse failed: '+e.message}finally{if(seq===request)loading(false)}}
async function initialize(){loading(true,'Finding backup snapshots…');try{let snapshots=await api('/snapshots');let v=$('version');v.replaceChildren();for(let snapshot of snapshots){let option=document.createElement('option');option.value=snapshot.id;option.textContent=snapshot.volume;v.append(option)}if(snapshots.length)await navigate('');else $('message').textContent='No snapshots found'}catch(e){$('message').textContent=e.message}finally{loading(false)}}
$('rootBtn').onclick=()=>{ $('search').value='';navigate('')};
$('version').onchange=()=>{selected.clear();updateSelection();$('search').value='';navigate('')};
$('searchBtn').onclick=()=>navigate('', $('search').value.trim());
$('search').onkeydown=e=>{if(e.key==='Enter')$('searchBtn').click()};
$('clearBtn').onclick=()=>{selected.clear();render(latest,false)};
$('selectAll').onchange=e=>{for(let item of latest){if(e.target.checked)selected.set(item.path,item);else selected.delete(item.path)}render(latest,false)};
$('restoreBtn').onclick=async()=>{let dest=$('destination').value.trim();if(!dest){$('message').textContent='Enter a restore destination first.';return}loading(true,'Restoring selected files…');try{let result=await api('/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:Number($('version').value),paths:[...selected.keys()],destination:dest})});$('message').textContent='Restored '+result.length+' files/entries.';selected.clear();updateSelection()}catch(e){$('message').textContent='Restore failed: '+e.message}finally{loading(false)}};
initialize();
</script></body></html>
